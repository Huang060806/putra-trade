server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/putra_trade?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Kuala_Lumpur
    username: root
    password: '123456'
  redis:
    host: localhost
    port: 6379
    password: '123456'
    database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      # Spring Boot 2.7 默认 PathPattern 与 springfox/springdoc 部分场景冲突，切回 ant
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

putra:
  jwt:
    # 用户端
    member-secret-key: PutraTradeMemberSecretKey2026PutraTradeMemberSecretKey
    member-ttl: 86400000
    member-token-name: Authorization
    # 管理端
    admin-secret-key: PutraTradeAdminSecretKey2026PutraTradeAdminSecretKey2026
    admin-ttl: 86400000
    admin-token-name: Authorization
  upload:
    path: /Users/timwong/Documents/Back-End/putra-trade/upload
